name: canvas_app
description: "Meander - бесплатная программа на Android для создания текстовых квестов"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.8.16+261

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Словари Material-виджетов (подсказки, даты, выделяемый текст) для
  # языков, отличных от en: без них `locale: ru` роняет любой экран,
  # читающий MaterialLocalizations.
  flutter_localizations:
    sdk: flutter
  mnd_core:
    path: ../../packages/mnd_core
  mnd_player:
    path: ../../packages/mnd_player

  flutter_rust_bridge: 2.12.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  markdown_widget: ^2.3.2+8
  url_launcher: ^6.2.5
  path_provider: ^2.0.15
  riverpod: ^2.6.1
  
  audioplayers: ^6.0.0
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  uuid: ^4.6.0
  image_picker: ^1.1.2
  path: ^1.8.3
  file_picker: ^12.0.0
  archive: ^4.0.7
  convert: ^3.1.1
  flutter_file_dialog: ^3.0.1
  http: ^1.5.0
  crypto: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^7.0.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  google_fonts: ^8.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.2.2
  window_manager: ^0.5.1
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  expressions: ^0.2.3
  visibility_detector: ^0.4.0+2
  collection: ^1.18.0
  app_links: ^7.2.1
  photo_view: ^0.15.0
  wakelock_plus: ^1.7.0
  audio_session: ^0.2.4
  encrypt: ^5.0.3
  package_info_plus: ^10.2.1
  pointycastle: ^3.9.1
  shimmer: ^3.0.0
  intl: ^0.20.0
  ffi: ^2.1.0
  flutter_colorpicker: ^1.1.0
  # HCT/тона и контраст — те же расчёты, что внутри ColorScheme.fromSeed.
  material_color_utilities: ^0.13.0
  google_sign_in: ^7.2.0
  yandex_login_sdk: ^1.0.1
  telegram_login: ^1.2.1
  talker_flutter: ^5.1.20
  lua_dardo: ^0.0.5
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^22.3.0
  pdf: ^3.13.0
  socket_io_client: ^3.1.6
  local_notifier: ^0.1.6
  vm_service: ^15.2.0
  sign_in_with_apple: ^8.2.0
  # Видео внутри офлайн-гайдов. Те же версии, что в mnd_player: 2.0.1 —
  # единственный релиз media_kit_video с починенным h/w-рендером на Linux.
  media_kit: ^1.2.3
  media_kit_video: ^2.0.1

# Значки платформ. Android и Windows здесь ВЫКЛЮЧЕНЫ намеренно: их делает
# tool/build_icons.py из assets/icon/logo.svg — адаптивный VectorDrawable
# (background/foreground/monochrome) плюс legacy-пинги, и .ico с кадрами
# 16/32/48/64/128/256. Если включить, flutter_launcher_icons зальёт поверх
# обычный растр: на Android перестанут работать маски лаунчера, в Windows
# заголовок окна станет мыльным.
flutter_launcher_icons:
  android: false
  image_path: "assets/icon/app_icon_1024.png"
  ios: true
  image_path_ios: "assets/icon/app_icon_1024.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    background_color: "#121212"
    theme_color: "#92FF26"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.7.0
  build_runner: ^2.4.8
  change_app_package_name: ^1.1.0

dependency_overrides:
  # iOS/macOS: откат на классический CocoaPods-плагин. Версии 2.5.0+ перешли
  # на native-assets + objective_c и падают при установке на устройство с
  # ошибкой подписи objective_c.framework (0xe8008014).
  path_provider_foundation: 2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cosmetics/
    - assets/data/
    - assets/fonts/
    # Офлайн-гайды: JSON шагов и статья на каждом языке + видео.
    - assets/guides/
    - assets/guides/create_quest/
    - assets/guides/market/
    - assets/guides/hub/
