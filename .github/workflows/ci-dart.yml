name: CI Flutter/Dart

on:
  pull_request:
    paths:
      [
        'apps/**',
        'packages/**',
        'crates/**',
        'Cargo.toml',
        'Cargo.lock',
        'melos.yaml',
        'scripts/setup_ffi_link.sh',
        '.github/workflows/ci-dart.yml',
      ]

concurrency:
  group: dart-${{ github.ref }}
  cancel-in-progress: true

env:
  # Одна версия на все сборки и проверки. `channel: stable` тянет новый
  # Flutter в каждом прогоне, поэтому падение на PR не воспроизводится
  # локально, а сгенерированные плагин-регистранты расходятся с коммитом.
  # За равенством следит test/ios/flutter_version_pin_test.dart.
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze Flutter packages
        run: melos run analyze:flutter

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MND_FFI_SO: ${{ github.workspace }}/target/release/libmnd_ffi.so
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-${{ runner.arch }}-

      - name: Build Rust FFI
        run: |
          ./scripts/setup_ffi_link.sh
          cargo build --locked --release -p mnd-ffi

      - name: Test Flutter packages
        run: melos run test:flutter
