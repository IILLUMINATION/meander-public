name: CI Flutter/Dart

on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'melos.yaml', '.github/workflows/ci-dart.yml']

concurrency:
  group: dart-${{ github.ref }}
  cancel-in-progress: true

env:
  # Одна версия на все сборки и проверки. `channel: stable` тянет новый
  # Flutter в каждом прогоне, поэтому падение на PR не воспроизводится
  # локально, а сгенерированные плагин-регистранты расходятся с коммитом.
  # За равенством следит test/ios/flutter_version_pin_test.dart.
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Test Dart packages
        run: melos run test

      - name: Test Flutter packages
        run: melos run test:flutter