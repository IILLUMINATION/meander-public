name: CI iOS

# Зачем: iOS нельзя собрать и тем более проверить на Linux-машине, из-за чего
# «не компилируется под Apple» всплывает только на Маке или у ревьюера App
# Store. Здесь две разные проверки.
#
#  1. `config` — статические guard-тесты (`test/ios/`) на Ubuntu: Info.plist,
#     entitlements, PrivacyInfo, минимальная iOS, прикрученный Xcode-фейз
#     сборки Rust. Дёшево, на каждый PR.
#  2. `build-ios` — реальная сборка на macOS-раннере: CocoaPods,
#     xcframework-плегины и статический `libmnd_ffi.framework` из Rust.
#     Симулятор и `--no-codesign` не требуют ни сертификатов, ни App Store
#     Connect API, поэтому job работает без секретов вообще.
#
# iOS-код нельзя скомпилировать на Linux. На PR собирается debug-симулятор:
# он ловит несовместимость Flutter/Swift, CocoaPods и Rust FFI без траты
# macOS-минут на релизный архив. Device release/archive проверяется на main,
# релизных тегах и ручном запуске — там же остаются проверки strip и символов.
#
# Чего CI НЕ доказывает: что приложение корректно ведёт себя на живом iPhone
# (анимации, размытие фона, тапы по нижней кнопке шита). Это по-прежнему
# руками на устройстве.
#
# Ручной релиз (подпись, архив, App Store Connect) — docs/ios-release.md.

on:
  pull_request:
    paths:
      [
        'apps/main_app/ios/**',
        'apps/main_app/lib/**',
        'apps/main_app/test/ios/**',
        'apps/main_app/pubspec.yaml',
        'apps/main_app/pubspec.lock',
        'packages/mnd_player/**',
        'packages/mnd_core/**',
        'crates/**',
        'Cargo.toml',
        'Cargo.lock',
        'scripts/build_ffi_apple.sh',
        'scripts/ios_ffi_phase.sh',
        'melos.yaml',
        '.github/workflows/ci-ios.yml',
      ]
  # Релизный тег должен пройти ту же сборку, что и main: иначе между мержем и
  # TestFlight остаётся окно, в котором сломанный iOS-билд никто не поймал.
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      slices:
        description: 'Какие срезы собирать на macOS'
        required: false
        default: 'both'
        type: choice
        options: ['both', 'simulator', 'device']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Та же версия, что в остальных сборках. `channel: stable` для iOS не
  # годится: Swift-код подписывается на API движка (`FlutterSceneDelegate`,
  # `FlutterImplicitEngineDelegate`), а плагин-регистранты генерируются под
  # конкретную версию Flutter. Разъехавшаяся версия собирается и падает уже
  # на устройстве.
  FLUTTER_VERSION: "3.47.9"

jobs:
  config:
    name: guard-тесты iOS-конфига (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slices: ${{ steps.slices.outputs.value }}
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать срезы сборки
        id: slices
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            value='[{"name":"simulator","rust_target":"aarch64-apple-ios-sim","ffi_flag":"--ios-sim","flutter_flag":"--simulator"}]'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            wanted='${{ github.event.inputs.slices }}'
            [ -z "$wanted" ] && wanted=both
            case "$wanted" in
              simulator)
                value='[{"name":"simulator","rust_target":"aarch64-apple-ios-sim","ffi_flag":"--ios-sim","flutter_flag":"--simulator"}]'
                ;;
              device)
                value='[{"name":"device","rust_target":"aarch64-apple-ios","ffi_flag":"--ios","flutter_flag":"--no-codesign"}]'
                ;;
              both)
                value='[{"name":"simulator","rust_target":"aarch64-apple-ios-sim","ffi_flag":"--ios-sim","flutter_flag":"--simulator"},{"name":"device","rust_target":"aarch64-apple-ios","ffi_flag":"--ios","flutter_flag":"--no-codesign"}]'
                ;;
              *)
                echo "::error::неизвестный срез: $wanted"
                exit 1
                ;;
            esac
          else
            value='[{"name":"simulator","rust_target":"aarch64-apple-ios-sim","ffi_flag":"--ios-sim","flutter_flag":"--simulator"},{"name":"device","rust_target":"aarch64-apple-ios","ffi_flag":"--ios","flutter_flag":"--no-codesign"}]'
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Статические проверки проекта
        run: flutter test test/ios

  build-ios:
    name: сборка (${{ matrix.slice.name }})
    needs: config
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.config.outputs.slices) }}
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      # Дефолтный Xcode 16.4 на macos-15 не знает NWPath.isUltraConstrained,
      # который использует connectivity_plus 7.3.x. Без Xcode 26 device-срез
      # падает ещё до архива.
      - name: Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version

      - name: Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.slice.rust_target }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.slice.rust_target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.slice.rust_target }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ветка 6.x, а не latest: melos 7/8 не читают `melos.yaml` этого
      # воркспейса и не поднимают его вовсе.
      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Pods cache
        uses: actions/cache@v4
        with:
          path: |
            apps/main_app/ios/Pods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/main_app/pubspec.lock', 'apps/main_app/ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      # Ядро собирается заранее: Xcode-фейз (`scripts/ios_ffi_phase.sh`) умеет
      # собрать и сам, но внутри лога xcodebuild это выглядит как «всё
      # зависло», а здесь сразу видно, если Rust под Apple не компилируется.
      - name: Rust FFI (${{ matrix.slice.rust_target }})
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/build_ffi_apple.sh ${{ matrix.slice.ffi_flag }}
          printf '%s' '${{ matrix.slice.rust_target }}' > apps/main_app/ios/Runner/Frameworks/.built-triple

      # Отдельная проверка архива: пустой файл или архив без Lua-символов
      # линкуется, но падает уже на старте приложения (`Undefined symbol`
      # проходит тихо только на этапе `-force_load`).
      - name: Целостность статического framework
        run: |
          bin="ios/Runner/Frameworks/libmnd_ffi.framework/libmnd_ffi"
          test -s "$bin" || { echo "!! $bin пуст или отсутствует"; exit 1; }
          nm -g "$bin" 2>/dev/null | grep -q frb_ || {
            echo "!! в архиве нет символов flutter_rust_bridge — FRB отвалится на старте"
            exit 1
          }
          nm -g "$bin" 2>/dev/null | grep -q luaL_newstate || {
            echo "!! Lua не вшит в архив (merge_lua_into_staticlib не сработал)"
            exit 1
          }

      - name: Build iOS app (${{ matrix.slice.name }})
        run: |
          if [ "${{ matrix.slice.name }}" = device ]; then
            # Именно ipa/archive, а не build ios: strip запускается на
            # deployment postprocessing, и только там ловится потеря
            # экспортируемых Rust-символов.
            flutter build ipa --release --no-codesign \
              --dart-define=MEANDER_API_BASE="${{ vars.MEANDER_API_BASE || 'https://meander.illuminat.dev' }}"
            app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner"
            test -f "$app" || { echo "!! не найден $app"; exit 1; }
            nm -g "$app" 2>/dev/null | grep -q frb_get_rust_content_hash || {
              echo "!! в финальном Runner нет frb_get_rust_content_hash: strip вырезал FFI"
              exit 1
            }
          else
            flutter build ios --debug --simulator --no-codesign \
              --dart-define=MEANDER_API_BASE="${{ vars.MEANDER_API_BASE || 'https://meander.illuminat.dev' }}"
          fi

      - name: Лог xcodebuild при неудаче
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.slice.name }}-logs
          path: apps/main_app/build/ios
          if-no-files-found: ignore
