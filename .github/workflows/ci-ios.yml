name: CI iOS

# Зачем: iOS нельзя собрать и тем более проверить на Linux-машине, из-за чего
# «не компилируется под Apple» всплывает только на Маке или у ревьюера
# App Store. Здесь две разные проверки.
#
#  1. `config` — статические guard-тесты (`test/ios/`) на Ubuntu: Info.plist,
#     entitlements, PrivacyInfo, минимальная iOS, прикрученный Xcode-фейз
#     сборки Rust. Дёшево, на каждый PR.
#  2. `build-ios` — реальная сборка на macOS-раннере: CocoaPods,
#     xcframework-плагины и статический `libmnd_ffi.framework` из Rust.
#     Сертификаты и App Store Connect API не нужны: `--no-codesign`.
#
# Симуляторного среза здесь нет: `flutter build ios --release --simulator`
# невозможен по определению («Release mode is not supported for simulators»),
# а debug-сборка симулятора не проверяет ни AOT, ни strip, которые и ломают
# релиз. Shipping-артефакт — device ipa, его и собираем.
#
# Чего CI НЕ доказывает: что приложение корректно ведёт себя на живом iPhone
# (анимации, размытие фона, тапы по нижней кнопке шита). Это по-прежнему
# руками на устройстве.
#
# Ручной релиз (подпись, архив, App Store Connect) — docs/ios-release.md.

on:
  pull_request:
    paths:
      [
        'apps/main_app/ios/**',
        'apps/main_app/lib/**',
        'apps/main_app/test/ios/**',
        'apps/main_app/pubspec.yaml',
        'apps/main_app/pubspec.lock',
        'packages/mnd_player/**',
        'packages/mnd_core/**',
        'crates/**',
        'Cargo.toml',
        'Cargo.lock',
        'scripts/build_ffi_apple.sh',
        'scripts/ios_ffi_phase.sh',
        'melos.yaml',
        '.github/workflows/ci-ios.yml',
      ]
  # Релизный тег должен пройти ту же сборку, что и PR: иначе между мержем и
  # TestFlight остаётся окно, в котором сломанный iOS-билд никто не поймал.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Та же версия, что в остальных сборках. `channel: stable` для iOS не
  # годится: Swift-код подписывается на API движка (`FlutterSceneDelegate`,
  # `FlutterImplicitEngineDelegate`), а плагин-регистранты генерируются под
  # конкретную версию Flutter. Разъехавшаяся версия собирается и падает уже
  # на устройстве.
  FLUTTER_VERSION: "3.47.9"

jobs:
  config:
    name: guard-тесты iOS-конфига (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Статические проверки проекта
        run: flutter test test/ios

  build-ios:
    name: сборка (device)
    needs: config
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      # Дефолтный Xcode 16.4 на macos-15 не знает NWPath.isUltraConstrained,
      # который использует connectivity_plus 7.3.x. Без Xcode 26 сборка
      # падает ещё до архива.
      - name: Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version

      - name: Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ветка 6.x, а не latest: melos 7/8 не читают `melos.yaml` этого
      # воркспейса и не поднимают его вовсе.
      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Pods cache
        uses: actions/cache@v4
        with:
          path: |
            apps/main_app/ios/Pods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/main_app/pubspec.lock', 'apps/main_app/ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      # Ядро собирается заранее: Xcode-фейз (`scripts/ios_ffi_phase.sh`) умеет
      # собрать и сам, но внутри лога xcodebuild это выглядит как «всё
      # зависло», а здесь сразу видно, если Rust под Apple не компилируется.
      - name: Rust FFI (aarch64-apple-ios)
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/build_ffi_apple.sh --ios
          printf '%s' 'aarch64-apple-ios' > apps/main_app/ios/Runner/Frameworks/.built-triple

      # Отдельная проверка архива: пустой файл или архив без Lua-символов
      # линкуется, но падает уже на старте приложения (`Undefined symbol`
      # проходит тихо только на этапе `-force_load`).
      - name: Целостность статического framework
        run: |
          bin="ios/Runner/Frameworks/libmnd_ffi.framework/libmnd_ffi"
          test -s "$bin" || { echo "!! $bin пуст или отсутствует"; exit 1; }
          nm -g "$bin" 2>/dev/null | grep -q frb_ || {
            echo "!! в архиве нет символов flutter_rust_bridge — FRB отвалится на старте"
            exit 1
          }
          nm -g "$bin" 2>/dev/null | grep -q luaL_newstate || {
            echo "!! Lua не вшит в архив (merge_lua_into_staticlib не сработал)"
            exit 1
          }

      - name: Build iOS app (device)
        run: |
          # Именно ipa/archive, а не build ios: strip запускается на
          # deployment postprocessing, и только там ловится потеря
          # экспортируемых Rust-символов.
          flutter build ipa --release --no-codesign \
            --dart-define=MEANDER_API_BASE="${{ vars.MEANDER_API_BASE || 'https://meander.illuminat.dev' }}"
          app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner"
          test -f "$app" || { echo "!! не найден $app"; exit 1; }
          nm -g "$app" 2>/dev/null | grep -q frb_get_rust_content_hash || {
            echo "!! в финальном Runner нет frb_get_rust_content_hash: strip вырезал FFI"
            exit 1
          }

      - name: Лог xcodebuild при неудаче
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-logs
          path: apps/main_app/build/ios
          if-no-files-found: ignore