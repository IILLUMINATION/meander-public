name: Build Windows Release

on:
  # Только вручную: релизная сборка не запускается на каждый пуш.
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.47.9, а не 3.50.0: на 3.50.0 Linux-десктоп рисуется со сдвигом
  # на пол-окна (flutter/flutter#195885, хотфикс ждём в 3.50.1).
  FLUTTER_VERSION: "3.47.9"

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mnd-ffi (native Rust core)
        run: cargo build --release -p mnd-ffi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: apps/main_app
        run: flutter pub get

      # Веб-оболочка для in-app веб-экспорта (см. build_web_template.sh).
      - name: Build web player template
        run: bash ./scripts/build_web_template.sh

      - name: Build Windows release
        working-directory: apps/main_app
        run: flutter build windows --release --dart-define=MEANDER_API_BASE="${{ vars.MEANDER_API_BASE || 'https://meander.illuminat.dev' }}"

      - name: Copy mnd_ffi.dll next to executable
        shell: bash
        run: cp target/release/mnd_ffi.dll apps/main_app/build/windows/x64/runner/Release/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          # 7 дней: релиз собирается вечером, артефакт нужен и после
          # разборов упавшего билда.
          retention-days: 7
          name: canvas_app-windows-x64
          path: apps/main_app/build/windows/x64/runner/Release