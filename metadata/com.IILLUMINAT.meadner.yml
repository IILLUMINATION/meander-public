    build:
      - rustup default 1.98.0
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android
      - cargo install cargo-ndk@4.1.2 --locked
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --flavor prod --release
    ndk: 28.2.13676358

MaintainerNotes: |-
  Do not submit until a FLOSS flavour exists.
  Blockers:
  1. Proprietary SDKs are hard-wired: yandex_mobileads (interstitials),
     yandex_login_sdk and google_sign_in (menu_screen.dart), Firebase/FCM
     (bootstrap.dart, firebase_messaging_service.dart). F-Droid rejects
     proprietary ad/tracking SDKs and GMS/Firebase dependencies.
     The public tree has no android/google-services.json, so FCM does not
     activate, but the libraries are still compiled in.
  2. There are no release tags in the repository, so UpdateCheckMode: Tags
     cannot work and checkupdates fails. Tag the release commit and keep
     tagging every release.
  3. Fastlane metadata is at apps/main_app/fastlane, but fdroidserver scans
     only fastlane/ at the checkout root. Move it to the repository root.
  4. Phone screenshots are missing: only desktop 1280x647 captures exist,
     and they are not committed.
  5. Rust 1.98.0, cargo-ndk 4.1.2 and NDK 28.2.13676358 must exist in the
     fdroidserver build image; this was not verified here.

AutoUpdateMode: Version
UpdateCheckMode: Tags
