[package]
name = "mnd-cli"
version = "0.1.0"
edition.workspace = true
description = "Консольный headless-раннер квестов Meander"

[dependencies]
mnd-core = { path = "../mnd-core" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
uuid = { version = "1", features = ["v4"] }